apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devsecops-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/k-paris/DevSecOps-01.git
    targetRevision: develop
    path: helm/devsecops-01

    helm:
      valueFiles:
        - values-test.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: devsecops-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
