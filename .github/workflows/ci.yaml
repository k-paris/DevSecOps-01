name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Show environment
        run: |
          echo "Running on:"
          hostname
          echo
          echo "User:"
          whoami
          echo
          echo "OS:"
          cat /etc/os-release

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  sast:
    name: SAST
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config auto --error

  SCA:
    name: SCA
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt

  container-scan:
    name: Container Security
    runs-on: self-hosted
    needs: [test, sast, sca]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker image
        run: |
          docker build -t devsecops-01:${{ github.sha }} .

      - name: Scan image
        run: |
          trivy image \
             --scanners vuln \
             --severity HIGH,CRITICAL \
             --ignore-unfixed \
             --exit-code 1 \
             --no-progress \
             devsecops-01:${{ github.sha }}
