name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:

  secret-scan:
    name: Secret Scan
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --verbose

  test:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Show environment
        run: |
          echo "Running on:"
          hostname
          echo
          echo "User:"
          whoami
          echo
          echo "OS:"
          cat /etc/os-release

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

  sast:
    name: SAST
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan --config auto --error

  SCA:
    name: SCA
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python -m pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt

  container-scan:
    name: Container Security
    runs-on: self-hosted
    needs: [test, sast, sca, secret-scan]

    permissions:
      contents: read
      packages: write  

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build Docker image
        run: |
          docker build -t devsecops-01:${{ github.sha }} .

      - name: Verify container runs as non-root
        run: |
          USER_ID=$(docker run --rm devsecops-01:${{ github.sha }} id -u)

          echo "Container UID: $USER_ID"

          if [ "$USER_ID" = "0" ]; then
            echo "ERROR: Container runs as root"
            exit 1
          fi

          echo "Container runs as non-root"

      - name: Scan Dockerfile configuration
        run: |
          trivy config \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            Dockerfile

      - name: Scan image
        run: |
          trivy image \
             --scanners vuln \
             --severity HIGH,CRITICAL \
             --ignore-unfixed \
             --exit-code 1 \
             --no-progress \
             devsecops-01:${{ github.sha }}

      - name: Log in to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          mkdir -p "$DOCKER_CONFIG"

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Tag image for GHCR
        run: |
          docker tag \
            devsecops-01:${{ github.sha }} \
            ghcr.io/k-paris/devsecops-01:${{ github.sha }}

      - name: Push image to GHCR
        run: |
          docker push \
            ghcr.io/k-paris/devsecops-01:${{ github.sha }}

      - name: Generate CycloneDX SBOM
        run: |
          trivy image \
            --format cyclonedx \
            --output sbom.cdx.json \
            devsecops-01:${{ github.sha }}

      - name: Generate SPDX SBOM
        run: |
          trivy image \
          --format spdx-json \
          --output sbom.spdx.json \
          devsecops-01:${{ github.sha }}
     
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.cdx.json
            sbom.spdx.json

  k8s-security:
    name: Kubernetes Security
    runs-on: self-hosted
    needs: [container-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Lint Helm chart
        run: |
          helm lint ./helm/devsecops-01

      - name: Render Kubernetes manifests
        run: |
          helm template devsecops-01 ./helm/devsecops-01 \
            --namespace devsecops \
            --set image.repository=ghcr.io/k-paris/devsecops-01 \
            --set image.tag=${{ github.sha }} \
            > /tmp/devsecops-rendered.yaml

      - name: Scan Kubernetes manifests
        run: |
          trivy config \
            --config-check ./security/trivy/checks \
            --namespaces builtin \
            --namespaces user \
            --ignorefile .trivyignore \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            /tmp/devsecops-rendered.yaml
